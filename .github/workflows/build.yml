name: Compilar IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar version de Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Compilar Proyecto (.app)
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Empaquetar en archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/ThreeOneOSFive.app Payload/
          zip -r ThreeOneOSFive.ipa Payload

      - name: Subir ejecutable IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: ThreeOneOSFive.ipa
